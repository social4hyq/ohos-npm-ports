name: Website
on:
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml", "ports/**"]
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml", "ports/**"]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - run: pnpm run check
        working-directory: website
      - run: pnpm test
        working-directory: website
      - run: pnpm run sync-data
        working-directory: website
      - run: pnpm run build
        working-directory: website
      - run: pnpm exec playwright install --with-deps --only-shell chromium
        working-directory: website
      - run: pnpm run test:e2e
        working-directory: website
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: website-browser-results-${{ matrix.os }}
          path: |
            website/playwright-report/
            website/test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          path: website/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
