name: ports-report

# 周调度：全量 port 的落后报告（tap version-check.yml 的对应物）——不限白名单，
# 给人决定手工 bump、扩白名单、或推动上游收口/deprecate 的依据。只报告，不动手。
# 兼职：把 fork main 与上游 main 对齐（merge 上游 main 后推回 fork），
# 保持 fork main = 上游 main + 自动化文件 这条不变式。

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 11:00 CST
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write # 同步 fork main

jobs:
  report:
    if: github.repository == 'social4hyq/ohos-npm-ports'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: ghcr.io/hqzing/dockerharmony:latest
      volumes:
        - /tmp/node24:/__e/node24:rw,rshared
    steps:
      - name: Setup node for actions
        run: |
          curl -fLO https://github.com/hqzing/ohos-node/releases/download/v24.2.0/node-v24.2.0-openharmony-arm64.tar.gz
          mkdir /__e/node24/bin
          tar -zxf node-v24.2.0-openharmony-arm64.tar.gz
          cp node-v24.2.0-openharmony-arm64/bin/node /__e/node24/bin/node
          rm -rf node-v24.2.0-openharmony-arm64*

      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Fetch upstream main
        run: git fetch --quiet https://github.com/ohos-npm-ports/ohos-npm-ports main

      - name: Full ports report
        run: |
          {
            echo "### ports report @ $(date -u +%FT%TZ)"
            echo
            echo "| port | 目录最新版 | 上游最新版 | 状态 | 白名单 |"
            echo "|---|---|---|---|---|"
            UPSTREAM_REF=FETCH_HEAD .github/scripts/check-upstream-versions.sh |
            awk -F'\t' '{
              status = ($4 == "behind" && $5 == "true") ? "**behind**" : $4
              printf "| %s | %s | %s | %s | %s |\n", $1, $2, $3, status, $5
            }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync fork main with upstream main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "autobump[bot]"
          git config user.email "autobump@users.noreply.github.com"
          git checkout -q -B sync main
          # automation 文件只占 .github/，与上游改动路径天然不相交，冲突可能性≈0；
          # 万一冲突（上游也建了同名路径），宁可不推，留给人工处理
          if git merge --no-edit --quiet FETCH_HEAD 2>/dev/null; then
            git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:main || echo "::warning::fork main push failed"
          else
            echo "::warning::merge upstream main into fork main conflicted; manual sync needed"
          fi
