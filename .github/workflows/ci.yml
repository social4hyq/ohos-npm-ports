name: CI

on:
  push:
    # 只监听 main: feature 分支的 push 交给下面的 pull_request 处理,
    # 否则同仓 PR 的 push 与 pull_request 各触发一次, 白跑一遍容器构建。
    # main 的 push 仍要构建 —— Publish 与 Build 在同一个 job 里,
    # 产物不跨 job 传递, 跳过 Build 就无从发布。
    branches:
      - main
    paths:
      - "ports/**"
  pull_request:
    paths:
      - "ports/**"

jobs:
  # 检测哪些目录的文件有变化，截取出 ports/<name>/<version> 这一级
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find changed port versions
        id: set-matrix
        run: |
          BASE=${{ github.event.before }}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          fi

          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD^)
          fi

          dirs=$(git diff --name-only --diff-filter=d "$BASE" HEAD \
                 | grep '^ports/' \
                 | sed -E 's|^(ports/[^/]+/[^/]+)/.*|\1|' \
                 | sort -u \
                 | jq -R -s -c 'split("\n")[:-1]')

          echo "matrix=$dirs" >> $GITHUB_OUTPUT

  # 对于发生变化的目录，进去执行里面的 build.sh 和 publish.sh
  build-and-publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    strategy:
      matrix:
        dir: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/ohos-npm-ports/ci-runner:latest
      volumes:
        - /tmp/node24:/__e/node24:rw,rshared
    steps:
      # 预置 Node.js。这版 Node.js 仅供 actions/checkout 使用，不会对构建业务产生干扰。
      - name: Setup node for actions
        run: |
          curl -fLO https://github.com/hqzing/ohos-node/releases/download/v24.2.0/node-v24.2.0-openharmony-arm64.tar.gz
          mkdir /__e/node24/bin
          tar -zxf node-v24.2.0-openharmony-arm64.tar.gz
          cp node-v24.2.0-openharmony-arm64/bin/node /__e/node24/bin/node
          rm -rf node-v24.2.0-openharmony-arm64*

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: |
          cd "${{ matrix.dir }}"
          ./build.sh

      # PR 事件下 Publish 不触发, 产物随 job 结束消失。打成 tarball 存进 artifact,
      # 供不经过 npm 的下游取用(如 formula 的测试块)。
      #
      # 产物路径由 publish.sh 自己决定(它 cd 到产物目录再 npm publish), 所以这里
      # 把 publish.sh 里的 npm publish 换成 npm pack, 而不是去猜各 port 的目录结构
      # —— 单包和多包(如 pnpm 的槽位包 + wrapper)都成立, 各 port 的 build.sh 和
      # publish.sh 无需改动。npm pack 不认 --tag/--access, 一并剥掉。
      - name: Pack
        run: |
          cd "${{ matrix.dir }}"
          sed -e 's|npm publish|npm pack --pack-destination "$ARTIFACTS"|g' \
              -e 's| *--tag [^ ]*||g' \
              -e 's| *--access [^ ]*||g' \
              publish.sh > .publish-release.sh
          if grep -q 'npm publish' .publish-release.sh; then
            echo "::error::publish.sh 里的 npm publish 没能全部替换, 请检查格式"
            exit 1
          fi
          mkdir -p artifacts
          ARTIFACTS="$PWD/artifacts" sh .publish-release.sh
          ls -1 artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: port-${{ strategy.job-index }}
          path: ${{ matrix.dir }}/artifacts/*.tgz
          if-no-files-found: error

      # 把 artifact 挂到 release, 供容器外的消费方按公开 URL 取用(容器下 artifact
      # 需要认证, formula 的测试块取不到)。tag 用 <port>-<version>, 重复构建会覆盖。
      # 开关是仓库变量 PORTS_RELEASE: fork 里开, 上游不开 —— 否则未经维护者同意
      # 就发 release, 且会和上游自己的发布流程撞 tag。
      # 放在 Publish 之前: Publish 在没有 NPM_TOKEN 的 fork 上会失败, 失败后
      # 本步骤会被跳过。
      - name: Compute release tag
        id: reltag
        if: github.event_name == 'push' && vars.PORTS_RELEASE == 'true'
        run: |
          d="${{ matrix.dir }}"
          echo "tag=$(basename "$(dirname "$d")")-$(basename "$d")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name == 'push' && vars.PORTS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          name: ${{ steps.reltag.outputs.tag }}
          files: ${{ matrix.dir }}/artifacts/*.tgz
          fail_on_unmatched_files: true

      # 只有直接 push 或 PR 被合入时才会进行发布
      - name: Publish
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          cd "${{ matrix.dir }}"
          ./publish.sh
