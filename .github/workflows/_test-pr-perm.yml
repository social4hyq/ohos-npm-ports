name: _test-pr-perm
on: { workflow_dispatch: {} }
permissions:
  contents: write
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          git config user.name "autobump[bot]"
          git config user.email "autobump@users.noreply.github.com"
          git checkout -b _test-pr-perm-probe
          echo "probe $(date -u +%s)" > .github/_pr-perm-probe.txt
          git add .github/_pr-perm-probe.txt
          git commit -q -m "test: probe same-repo GITHUB_TOKEN PR permission"
          git push -q origin _test-pr-perm-probe
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d '{"title":"[probe] same-repo GITHUB_TOKEN PR permission","head":"_test-pr-perm-probe","base":"main","body":"temporary, will be closed immediately"}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
